name: tests

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"   # production ใช้ 3.14.5 (docs/ENVIRONMENT.md) — 3.13 = เวอร์ชันที่ wheel ครบบน runner
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unified verification runner (catalog + integrity + lint + pytest)
        run: python tools/verify_all.py

